
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>ASURA · Join Server</title>

  <style>
    :root {
      --bg: #05090a;
      --cyan: #00f2ea;
      --purple: #a855f7;
      --text: #e8fdfc;
      --muted: #7b8f8e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--text);
      font-family: Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    /* =================================
       CYAN DIGITAL RAIN
    ================================= */

    .container {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-color: #000;

      background-image:
        radial-gradient(4px 100px at 0px 235px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 235px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 117.5px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 252px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 252px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 126px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 150px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 150px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 75px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 204px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 204px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 102px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 134px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 134px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 67px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 179px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 179px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 89.5px, #00f2ea 100%, #0000 150%),

        radial-gradient(4px 100px at 0px 215px, #00f2ea, #0000),
        radial-gradient(4px 100px at 300px 215px, #00f2ea, #0000),
        radial-gradient(1.5px 1.5px at 150px 107.5px, #00f2ea 100%, #0000 150%);

      background-size:
        300px 235px, 300px 235px, 300px 235px,
        300px 252px, 300px 252px, 300px 252px,
        300px 150px, 300px 150px, 300px 150px,
        300px 204px, 300px 204px, 300px 204px,
        300px 134px, 300px 134px, 300px 134px,
        300px 179px, 300px 179px, 300px 179px,
        300px 215px, 300px 215px, 300px 215px;

      filter: drop-shadow(0 0 3px #00f2ea);
      animation: rain 35s linear infinite;
    }

    @keyframes rain {
      from {
        background-position:
          0px 220px, 3px 220px, 151.5px 337.5px,
          25px 24px, 28px 24px, 176.5px 150px,
          50px 16px, 53px 16px, 201.5px 91px,
          100px 19px, 103px 19px, 251.5px 121px,
          125px 120px, 128px 120px, 276.5px 187px,
          150px 31px, 153px 31px, 301.5px 120.5px,
          200px 121px, 203px 121px, 351.5px 228.5px;
      }

      to {
        background-position:
          0px 6800px, 3px 6800px, 151.5px 6917.5px,
          25px 13632px, 28px 13632px, 176.5px 13758px,
          50px 5416px, 53px 5416px, 201.5px 5491px,
          100px 5119px, 103px 5119px, 251.5px 5221px,
          125px 8428px, 128px 8428px, 276.5px 8495px,
          150px 9876px, 153px 9876px, 301.5px 9965.5px,
          200px 14741px, 203px 14741px, 351.5px 14848.5px;
      }
    }

    /* =================================
       ASURA CARD
    ================================= */

    .card {
      width: 100%;
      max-width: 460px;
      border: 2px solid rgba(0,242,234,.55);
      background: rgba(0,10,12,.88);
      backdrop-filter: blur(8px);

      box-shadow:
        0 0 42px rgba(0,242,234,.18),
        inset 0 0 25px rgba(0,242,234,.035);

      padding: 34px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* =================================
       HAMSTER ANIMATION
    ================================= */

    .wheel-and-hamster {
      --dur: 1s;
      position: relative;
      width: 12em;
      height: 12em;
      max-width: 100%;
      font-size: 14px;
      margin: 0 auto 18px;
    }

    .wheel,
    .hamster,
    .hamster div,
    .spoke {
      position: absolute;
    }

    .wheel,
    .spoke {
      border-radius: 50%;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .wheel {
      background: radial-gradient(
        100% 100% at center,
        hsla(0,0%,60%,0) 47.8%,
        hsl(0,0%,60%) 48%
      );
      z-index: 2;
    }

    .hamster {
      animation: hamster var(--dur) ease-in-out infinite;
      top: 50%;
      left: calc(50% - 3.5em);
      width: 7em;
      height: 3.75em;
      transform: rotate(4deg) translate(-0.8em,1.85em);
      transform-origin: 50% 0;
      z-index: 1;
    }

    .hamster__head {
      animation: hamsterHead var(--dur) ease-in-out infinite;
      background: hsl(30,90%,55%);
      border-radius: 70% 30% 0 100% / 40% 25% 25% 60%;
      box-shadow:
        0 -0.25em 0 hsl(30,90%,80%) inset,
        0.75em -1.55em 0 hsl(30,90%,90%) inset;
      top: 0;
      left: -2em;
      width: 2.75em;
      height: 2.5em;
      transform-origin: 100% 50%;
    }

    .hamster__ear {
      animation: hamsterEar var(--dur) ease-in-out infinite;
      background: hsl(0,90%,85%);
      border-radius: 50%;
      box-shadow: -0.25em 0 hsl(30,90%,55%) inset;
      top: -0.25em;
      right: -0.25em;
      width: 0.75em;
      height: 0.75em;
      transform-origin: 50% 75%;
    }

    .hamster__eye {
      animation: hamsterEye var(--dur) linear infinite;
      background-color: #000;
      border-radius: 50%;
      top: 0.375em;
      left: 1.25em;
      width: 0.5em;
      height: 0.5em;
    }

    .hamster__nose {
      background: hsl(0,90%,75%);
      border-radius: 35% 65% 85% 15% / 70% 50% 50% 30%;
      top: 0.75em;
      left: 0;
      width: 0.2em;
      height: 0.25em;
    }

    .hamster__body {
      animation: hamsterBody var(--dur) ease-in-out infinite;
      background: hsl(30,90%,90%);
      border-radius: 50% 30% 50% 30% / 15% 60% 40% 40%;
      box-shadow:
        0.1em 0.75em 0 hsl(30,90%,55%) inset,
        0.15em -0.5em 0 hsl(30,90%,80%) inset;
      top: 0.25em;
      left: 2em;
      width: 4.5em;
      height: 3em;
      transform-origin: 17% 50%;
      transform-style: preserve-3d;
    }

    .hamster__limb--fr,
    .hamster__limb--fl {
      clip-path: polygon(0 0,100% 0,70% 80%,60% 100%,0% 100%,40% 80%);
      top: 2em;
      left: 0.5em;
      width: 1em;
      height: 1.5em;
      transform-origin: 50% 0;
    }

    .hamster__limb--fr {
      animation: hamsterFRLimb var(--dur) linear infinite;
      background: linear-gradient(hsl(30,90%,80%) 80%,hsl(0,90%,75%) 80%);
      transform: rotate(15deg) translateZ(-1px);
    }

    .hamster__limb--fl {
      animation: hamsterFLLimb var(--dur) linear infinite;
      background: linear-gradient(hsl(30,90%,90%) 80%,hsl(0,90%,85%) 80%);
      transform: rotate(15deg);
    }

    .hamster__limb--br,
    .hamster__limb--bl {
      border-radius: 0.75em 0.75em 0 0;
      clip-path: polygon(0 0,100% 0,100% 30%,70% 90%,70% 100%,30% 100%,40% 90%,0% 30%);
      top: 1em;
      left: 2.8em;
      width: 1.5em;
      height: 2.5em;
      transform-origin: 50% 30%;
    }

    .hamster__limb--br {
      animation: hamsterBRLimb var(--dur) linear infinite;
      background: linear-gradient(hsl(30,90%,80%) 90%,hsl(0,90%,75%) 90%);
      transform: rotate(-25deg) translateZ(-1px);
    }

    .hamster__limb--bl {
      animation: hamsterBLLimb var(--dur) linear infinite;
      background: linear-gradient(hsl(30,90%,90%) 90%,hsl(0,90%,85%) 90%);
      transform: rotate(-25deg);
    }

    .hamster__tail {
      animation: hamsterTail var(--dur) linear infinite;
      background: hsl(0,90%,85%);
      border-radius: 0.25em 50% 50% 0.25em;
      box-shadow: 0 -0.2em 0 hsl(0,90%,75%) inset;
      top: 1.5em;
      right: -0.5em;
      width: 1em;
      height: 0.5em;
      transform: rotate(30deg) translateZ(-1px);
      transform-origin: 0.25em 0.25em;
    }

    .spoke {
      animation: spoke var(--dur) linear infinite;
      background: radial-gradient(
        100% 100% at center,
        hsl(0,0%,60%) 4.8%,
        hsla(0,0%,60%,0) 5%
      ),
      linear-gradient(
        hsla(0,0%,55%,0) 46.9%,
        hsl(0,0%,65%) 47% 52.9%,
        hsla(0,0%,65%,0) 53%
      ) 50% 50% / 99% 99% no-repeat;
    }

    /* HAMSTER KEYFRAMES */

    @keyframes hamster {
      from, to {
        transform: rotate(4deg) translate(-0.8em,1.85em);
      }
      50% {
        transform: rotate(0) translate(-0.8em,1.85em);
      }
    }

    @keyframes hamsterHead {
      from, 25%, 50%, 75%, to { transform: rotate(0); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(8deg); }
    }

    @keyframes hamsterEye {
      from, 90%, to { transform: scaleY(1); }
      95% { transform: scaleY(0); }
    }

    @keyframes hamsterEar {
      from, 25%, 50%, 75%, to { transform: rotate(0); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(12deg); }
    }

    @keyframes hamsterBody {
      from, 25%, 50%, 75%, to { transform: rotate(0); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-2deg); }
    }

    @keyframes hamsterFRLimb {
      from, 25%, 50%, 75%, to {
        transform: rotate(50deg) translateZ(-1px);
      }
      12.5%, 37.5%, 62.5%, 87.5% {
        transform: rotate(-30deg) translateZ(-1px);
      }
    }

    @keyframes hamsterFLLimb {
      from, 25%, 50%, 75%, to { transform: rotate(-30deg); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(50deg); }
    }

    @keyframes hamsterBRLimb {
      from, 25%, 50%, 75%, to {
        transform: rotate(-60deg) translateZ(-1px);
      }
      12.5%, 37.5%, 62.5%, 87.5% {
        transform: rotate(20deg) translateZ(-1px);
      }
    }

    @keyframes hamsterBLLimb {
      from, 25%, 50%, 75%, to { transform: rotate(20deg); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-60deg); }
    }

    @keyframes hamsterTail {
      from, 25%, 50%, 75%, to {
        transform: rotate(30deg) translateZ(-1px);
      }
      12.5%, 37.5%, 62.5%, 87.5% {
        transform: rotate(10deg) translateZ(-1px);
      }
    }

    @keyframes spoke {
      from { transform: rotate(0); }
      to { transform: rotate(-1turn); }
    }

    /* =================================
       TEXT AND BUTTONS
    ================================= */

    h1 {
      color: var(--cyan);
      font-size: 21px;
      letter-spacing: .2em;
      text-shadow: 0 0 12px rgba(0,242,234,.5);
    }

    .sub {
      color: var(--muted);
      font-size: 11px;
      word-break: break-all;
      margin-bottom: 26px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 12px;
      border: 2px solid var(--cyan);
      background: rgba(0,242,234,.06);
      color: var(--cyan);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: .12em;
      cursor: pointer;
      font-family: inherit;
      transition: .2s ease;
    }

    .btn:hover {
      background: rgba(0,242,234,.15);
      box-shadow: 0 0 24px rgba(0,242,234,.3);
      transform: translateY(-2px);
    }

    .secondary {
      margin-top: 12px;
      border-color: var(--purple);
      color: var(--purple);
      font-size: 11px;
    }

    .status {
      margin-top: 22px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .error {
      color: #ff6b81;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 18px;
      }

      .wheel-and-hamster {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container,
      .wheel-and-hamster * {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="container"></div>

  <main class="card">

    <!-- HAMSTER LOGO -->

    <div
      aria-label="Orange and tan hamster running in a metal wheel"
      role="img"
      class="wheel-and-hamster"
    >
      <div class="wheel"></div>

      <div class="hamster">
        <div class="hamster__body">
          <div class="hamster__head">
            <div class="hamster__ear"></div>
            <div class="hamster__eye"></div>
            <div class="hamster__nose"></div>
          </div>

          <div class="hamster__limb hamster__limb--fr"></div>
          <div class="hamster__limb hamster__limb--fl"></div>
          <div class="hamster__limb hamster__limb--br"></div>
          <div class="hamster__limb hamster__limb--bl"></div>
          <div class="hamster__tail"></div>
        </div>
      </div>

      <div class="spoke"></div>
    </div>

    <h1 id="title">ASURA SERVER</h1>

    <p class="sub" id="server">
      Preparing server connection...
    </p>

    <a class="btn" id="open" href="#">
      JOIN EXACT SERVER
    </a>

    <a class="btn secondary" id="fallback" href="#">
      OPEN WITH ROBLOX WEBSITE
    </a>

    <p class="status" id="status">
      Select JOIN EXACT SERVER to open Roblox.
    </p>

  </main>

  <script>
    // ASURA ROBLOX JOIN SYSTEM

    const PLACE_ID = 13358463560;

    const UUID =
      /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    const titleEl = document.getElementById("title");
    const serverEl = document.getElementById("server");
    const openEl = document.getElementById("open");
    const fallbackEl = document.getElementById("fallback");
    const statusEl = document.getElementById("status");

    function fail(message) {
      titleEl.textContent = "INVALID SERVER";
      serverEl.textContent = "ASURA";
      openEl.style.display = "none";
      fallbackEl.style.display = "none";
      statusEl.textContent = message;
      statusEl.classList.add("error");
    }

    const path = window.location.pathname.replace(/\/+$/, "");

    let jobId = "";

    const segments = path.split("/").filter(Boolean);

    if (segments.length >= 2 && segments[0] === "join") {
      jobId = segments[1];
    }

    if (!jobId) {
      jobId =
        new URLSearchParams(window.location.search).get("server") || "";
    }

    if (!UUID.test(jobId)) {

      fail(
        "Invalid server ID. Please use the Join Server button from Discord."
      );

    } else {

      serverEl.textContent = "SERVER ID: " + jobId;

      const params = new URLSearchParams({
        placeId: String(PLACE_ID),
        gameInstanceId: jobId
      });

      const deepLink =
        "roblox://experiences/start?" + params.toString();

      const webLink =
        "https://www.roblox.com/games/start?" + params.toString();

      openEl.href = deepLink;
      fallbackEl.href = webLink;

      openEl.addEventListener("click", function() {
        statusEl.textContent =
          "Opening Roblox and requesting server " + jobId;
      });

      fallbackEl.addEventListener("click", function() {
        statusEl.textContent =
          "Opening the official Roblox launcher.";
      });

      console.log("ASURA JOIN SYSTEM");
      console.log("PLACE ID:", PLACE_ID);
      console.log("JOB ID:", jobId);
      console.log("DEEP LINK:", deepLink);
      console.log("WEB LINK:", webLink);
    }
  </script>

</body>
</html>
